<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVANTI — Премиальный маркетплейс одежды</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1117;
            --surface-color: #1a1d26;
            --surface-hover: #232733;
            --border-color: #2e3445;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            transition: var(--transition);
        }

        /* Баннер акций */
        .promo-ticker {
            background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
            color: #fff;
            text-align: center;
            padding: 0.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .logo span {
            color: var(--accent);
        }

        .search-bar {
            flex: 1;
            max-width: 450px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-bar svg {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .action-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .action-btn:hover {
            border-color: var(--accent);
            background: var(--surface-hover);
        }

        .badge-count {
            background: var(--accent);
            color: #fff;
            font-size: 0.75rem;
            padding: 0.1rem 0.45rem;
            border-radius: 20px;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        @media(max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
        }

        .sidebar {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 5rem;
        }

        .filter-section {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .filter-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .checkbox-label:hover {
            color: var(--text-main);
        }

        .checkbox-label input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .catalog-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 14px;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }

        .product-img-wrapper {
            position: relative;
            height: 300px;
            background: var(--bg-color);
            overflow: hidden;
            cursor: pointer;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.06);
        }

        .discount-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--danger);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            z-index: 2;
        }

        .wishlist-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            z-index: 2;
        }

        .wishlist-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
        }

        .wishlist-btn.active svg {
            fill: var(--danger);
            stroke: var(--danger);
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }

        .product-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .product-rating {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: var(--transition);
        }

        .product-title:hover {
            color: var(--accent);
        }

        .product-sizes-preview {
            display: flex;
            gap: 0.3rem;
            margin: 0.3rem 0;
        }

        .size-tag {
            font-size: 0.7rem;
            border: 1px solid var(--border-color);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
        }

        .product-price-box {
            display: flex;
            flex-direction: column;
        }

        .product-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .product-old-price {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1.1rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Выдвижные панели */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .drawer-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: var(--surface-color);
            z-index: 201;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.3);
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drawer.open {
            right: 0;
        }

        .drawer-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-header h3 {
            font-size: 1.2rem;
            font-weight: 750;
        }

        .close-drawer {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .close-drawer:hover {
            color: var(--text-main);
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 12px;
            align-items: center;
        }

        .cart-item img {
            width: 70px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .cart-item-title {
            font-size: 0.95rem;
            font-weight: 650;
        }

        .cart-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cart-item-price {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }

        .qty-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-main);
            font-weight: bold;
        }

        .remove-item {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: auto;
        }

        .drawer-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--surface-color);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .promo-box {
            display: flex;
            gap: 0.5rem;
        }

        .promo-box input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .promo-box button {
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 750;
        }

        .checkout-btn {
            width: 100%;
            background: var(--success);
            color: #fff;
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        .empty-cart {
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
            font-size: 0.95rem;
        }

        /* Модальное окно быстрого просмотра */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            padding: 1.5rem;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow);
        }

        @media(max-width: 768px) {
            .modal-card {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }
        }

        .modal-img {
            height: 400px;
            background: var(--bg-color);
        }

        .modal-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-close {
            position: absolute;
            top: 1rem; right: 1rem;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        .size-selector {
            display: flex;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .size-option {
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .size-option.selected {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        /* Уведомление тост */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 400;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
        }

        .toast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Шапка сайта -->
    <header>
        <div class="header-container">

            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

                <button class="action-btn" id="wishlistToggleBtn">

                    <label class="checkbox-label"><input type="checkbox" name="size" value="M"> M</label>
                    <label class="checkbox-label"><input type="checkbox" name="size" value="L"> L</label>
                    <label class="checkbox-label"><input type="checkbox" name="size" value="XL"> XL</label>
                </div>
            </div>
        </aside>

        <!-- Каталог -->
        <section class="catalog-content">

                <div style="display: flex; gap: 1rem; align-items: center;">
                    <select id="sortSelect" style="background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 8px; outline: none; cursor: pointer;">
                        <option value="popular" data-i18n="sort_popular">По популярности</option>
                        <option value="cheap" data-i18n="sort_cheap">Сначала дешевле</option>
                        <option value="expensive" data-i18n="sort_expensive">Сначала дороже</option>
                    </select>

            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Рендерится через JS -->
            </div>

    </main>

    <!-- Корзина -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3 data-i18n="cart_title">Ваша корзина</h3>
            <button class="close-drawer" id="closeCart">&times;</button>
        </div>
        <div class="drawer-body" id="cartItemsContainer">
            <div class="empty-cart" data-i18n="cart_empty">Корзина пуста</div>
        </div>
        <div class="drawer-footer" id="cartFooter" style="display: none;">
            <div class="promo-box">
                <input type="text" id="promoInput" placeholder="Промокод (AVANTI20)">
                <button id="applyPromoBtn">Ok</button>
            </div>

            { id: 14, title: { ru: "Сумка на плечо Crossbody", en: "Minimalist Crossbody Bag" }, category: "accessories", priceRUB: 2900, oldRUB: 3800, priceUSD: 32, rating: 4.7, size: ["M"], image: "https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80", desc: { ru: "Компактная городская сумка для мелочей и документов.", en: "Compact everyday crossbody bag for essentials." } },
            { id: 15, title: { ru: "Пальто классическое Oversize", en: "Classic Oversize Wool Coat" }, category: "jackets", priceRUB: 18500, oldRUB: 23000, priceUSD: 200, rating: 4.9, size: ["M", "L"], image: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=600&q=80", desc: { ru: "Шерстяное пальто премиального кроя для делового стиля.", en: "Tailored wool blend coat for sophisticated urban look." } },
            { id: 16, title: { ru: "Кепка бейсболка Icon", en: "Icon Baseball Cap" }, category: "accessories", priceRUB: 1800, oldRUB: 2400, priceUSD: 20, rating: 4.5, size: ["M"], image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=600&q=80", desc: { ru: "Плотный хлопок, регулируемая металлическая застежка.", en: "Sturdy cotton twill cap with metal strap closure." } }
        ];

        const i18n = {
            ru: {
                categories: "Категории",
                all: "Все товары",
                cat_hoodies: "Худи и Свитшоты",
                cat_jackets: "Куртки и Пальто",
                cat_pants: "Брюки и Джинсы",
                cat_tshirts: "Футболки",
                cat_acc: "Аксессуары и Сумки",
                sizes: "Размеры",
                sort_popular: "По популярности",
                sort_cheap: "Сначала дешевле",
                sort_expensive: "Сначала дороже",
                cart_title: "Ваша корзина",
                cart_empty: "Корзина пуста",
                wishlist_title: "Избранное",
                wishlist_empty: "В избранном пусто",
                total: "Итого:",
                checkout: "Оформить заказ",
                to_cart: "В корзину",
                found: "Найдено товаров:",
                order_success: "Заказ успешно оформлен! Спасибо за покупку в AVANTI.",
                added_cart: "Товар добавлен в корзину",
                promo_success: "Промокод AVANTI20 активирован (-20%)!",
                promo_error: "Неверный промокод",
                select_size: "Выберите размер:"
            },
            en: {
                categories: "Categories",
                all: "All Products",
                cat_hoodies: "Hoodies & Sweatshirts",
                cat_jackets: "Jackets & Coats",
                cat_pants: "Pants & Jeans",
                cat_tshirts: "T-Shirts",
                cat_acc: "Accessories & Bags",
                sizes: "Sizes",
                sort_popular: "Most Popular",
                sort_cheap: "Price: Low to High",
                sort_expensive: "Price: High to Low",
                cart_title: "Your Cart",
                cart_empty: "Your cart is empty",
                wishlist_title: "Wishlist",
                wishlist_empty: "Your wishlist is empty",
                total: "Total:",
                checkout: "Checkout",
                to_cart: "Add to cart",
                found: "Products found:",
                order_success: "Order placed successfully! Thank you for shopping with AVANTI.",
                added_cart: "Item added to cart",
                promo_success: "Promo code AVANTI20 applied (-20%)!",
                promo_error: "Invalid promo code",
                select_size: "Select size:"
            }
        };

        let currentLang = 'ru';
        let currentCurrency = 'RUB';
        let cart = [];
        let wishlist = [];
        let discountMultiplier = 1; // Скидка по промокоду
        let activeModalProduct = null;
        let selectedModalSize = null;

        // Элементы
        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const themeToggle = document.getElementById('themeToggle');
        const langToggle = document.getElementById('langToggle');
        const currencyToggle = document.getElementById('currencyToggle');
        
        const cartToggleBtn = document.getElementById('cartToggleBtn');
        const wishlistToggleBtn = document.getElementById('wishlistToggleBtn');
        const cartDrawer = document.getElementById('cartDrawer');
        const wishlistDrawer = document.getElementById('wishlistDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const closeCart = document.getElementById('closeCart');
        const closeWishlist = document.getElementById('closeWishlist');
        
        const cartCount = document.getElementById('cartCount');
        const wishlistCount = document.getElementById('wishlistCount');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const wishlistItemsContainer = document.getElementById('wishlistItemsContainer');
        const cartFooter = document.getElementById('cartFooter');
        const cartTotalPrice = document.getElementById('cartTotalPrice');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const productCountElem = document.getElementById('productCount');
        const toastNotification = document.getElementById('toastNotification');
        const promoInput = document.getElementById('promoInput');
        const applyPromoBtn = document.getElementById('applyPromoBtn');

        // Модальное окно
        const quickViewModal = document.getElementById('quickViewModal');
        const closeModal = document.getElementById('closeModal');
        const modalImage = document.getElementById('modalImage');
        const modalCategory = document.getElementById('modalCategory');
        const modalTitle = document.getElementById('modalTitle');
        const modalRating = document.getElementById('modalRating');
        const modalDesc = document.getElementById('modalDesc');
        const modalSizes = document.getElementById('modalSizes');
        const modalPrice = document.getElementById('modalPrice');
        const modalOldPrice = document.getElementById('modalOldPrice');
        const modalAddToCart = document.getElementById('modalAddToCart');

        themeToggle.addEventListener('click', () => {
            document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
        });

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            langToggle.textContent = currentLang === 'ru' ? '🇷🇺 RU' : '🇬🇧 EN';
            updateTranslations();
            renderProducts();
            renderCart();
            renderWishlist();
        });

        currencyToggle.addEventListener('click', () => {
            currentCurrency = currentCurrency === 'RUB' ? 'USD' : 'RUB';
            currencyToggle.textContent = currentCurrency === 'RUB' ? '₽ RUB' : '$ USD';
            renderProducts();
            renderCart();
        });

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.textContent = i18n[currentLang][key];
                }
            });
        }

        function renderProducts() {
            const searchQuery = searchInput.value.toLowerCase();
            const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);
            const selectedSizes = Array.from(document.querySelectorAll('input[name="size"]:checked')).map(cb => cb.value);

            let filtered = products.filter(p => {
                const matchesSearch = p.title[currentLang].toLowerCase().includes(searchQuery);
                const matchesCategory = selectedCategories.includes('all') || selectedCategories.includes(p.category);
                const matchesSize = selectedSizes.length === 0 || p.size.some(s => selectedSizes.includes(s));
                return matchesSearch && matchesCategory && matchesSize;
            });

            const sortVal = sortSelect.value;
            if (sortVal === 'cheap') {
                filtered.sort((a, b) => (currentCurrency === 'RUB' ? a.priceRUB - b.priceRUB : a.priceUSD - b.priceUSD));
            } else if (sortVal === 'expensive') {
                filtered.sort((a, b) => (currentCurrency === 'RUB' ? b.priceRUB - a.priceRUB : b.priceUSD - a.priceUSD));
            }

            productCountElem.textContent = `${i18n[currentLang].found} ${filtered.length}`;

            if (filtered.length === 0) {
                productsGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">Товары не найдены</div>`;
                return;
            }

            productsGrid.innerHTML = filtered.map(p => {
                const price = currentCurrency === 'RUB' ? `${p.priceRUB.toLocaleString()} ₽` : `$${p.priceUSD}`;
                const oldPrice = currentCurrency === 'RUB' ? `${p.oldRUB.toLocaleString()} ₽` : `$${Math.round(p.priceUSD * 1.25)}`;
                const isWishlisted = wishlist.includes(p.id);
                const sizesHTML = p.size.map(s => `<span class="size-tag">${s}</span>`).join('');
                
                return `
                    <div class="product-card">
                        <div class="discount-badge">-20%</div>
                        <div class="product-img-wrapper" onclick="openQuickView(${p.id})">
                            <img src="${p.image}" alt="${p.title[currentLang]}">
                            <button class="wishlist-btn ${isWishlisted ? 'active' : ''}" onclick="event.stopPropagation(); toggleWishlist(${p.id})">
                                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </button>
                        </div>
                        <div class="product-info">
                            <div class="product-top-row">
                                <span class="product-category">${p.category}</span>
                                <div class="product-rating">★ ${p.rating}</div>
                            </div>
                            <div class="product-title" onclick="openQuickView(${p.id})">${p.title[currentLang]}</div>
                            <div class="product-sizes-preview">${sizesHTML}</div>
                            <div class="product-footer">
                                <div class="product-price-box">
                                    <span class="product-price">${price}</span>
                                    <span class="product-old-price">${oldPrice}</span>
                                </div>
                                <button class="btn-primary" onclick="addToCartDirect(${p.id})">${i18n[currentLang].to_cart}</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Быстрый просмотр
        function openQuickView(id) {
            activeModalProduct = products.find(p => p.id === id);
            selectedModalSize = activeModalProduct.size[0];

            modalImage.src = activeModalProduct.image;
            modalCategory.textContent = activeModalProduct.category;
            modalTitle.textContent = activeModalProduct.title[currentLang];
            modalRating.innerHTML = `★ ${activeModalProduct.rating}`;
            modalDesc.textContent = activeModalProduct.desc[currentLang] || activeModalProduct.desc['ru'];

            const price = currentCurrency === 'RUB' ? `${activeModalProduct.priceRUB.toLocaleString()} ₽` : `$${activeModalProduct.priceUSD}`;
            const oldPrice = currentCurrency === 'RUB' ? `${activeModalProduct.oldRUB.toLocaleString()} ₽` : `$${Math.round(activeModalProduct.priceUSD * 1.25)}`;
            modalPrice.textContent = price;
            modalOldPrice.textContent = oldPrice;

            modalSizes.innerHTML = activeModalProduct.size.map(s => `
                <button class="size-option ${s === selectedModalSize ? 'selected' : ''}" onclick="selectModalSize('${s}')">${s}</button>
            `).join('');

            quickViewModal.classList.add('open');
        }

        function selectModalSize(s) {
            selectedModalSize = s;
            document.querySelectorAll('.size-option').forEach(btn => {
                btn.classList.toggle('selected', btn.textContent === s);
            });
        }

        closeModal.addEventListener('click', () => quickViewModal.classList.remove('open'));
        quickViewModal.addEventListener('click', (e) => { if(e.target === quickViewModal) quickViewModal.classList.remove('open'); });

        modalAddToCart.addEventListener('click', () => {
            if (activeModalProduct) {
                addToCart(activeModalProduct.id, selectedModalSize);
                quickViewModal.classList.remove('open');
            }
        });

        function addToCartDirect(id) {
            const product = products.find(p => p.id === id);
            addToCart(id, product.size[0]);
        }

        function addToCart(id, size) {
            const product = products.find(p => p.id === id);
            const cartKey = `${id}-${size}`;
            const existing = cart.find(item => item.cartKey === cartKey);
            
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, size, qty: 1, cartKey });
            }
            updateCartBadge();
            renderCart();
            showToast(i18n[currentLang].added_cart);
        }

        function updateCartBadge() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            cartCount.textContent = totalQty;
        }

        function renderCart() {
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<div class="empty-cart">${i18n[currentLang].cart_empty}</div>`;
                cartFooter.style.display = 'none';
                return;
            }

            cartFooter.style.display = 'flex';
            let totalSum = 0;

            cartItemsContainer.innerHTML = cart.map(item => {
                const itemPrice = currentCurrency === 'RUB' ? item.priceRUB : item.priceUSD;
                totalSum += itemPrice * item.qty;
                return `
                    <div class="cart-item">
                        <img src="${item.image}" alt="">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.title[currentLang]}</div>
                            <div class="cart-item-meta">Размер: ${item.size}</div>
                            <div class="cart-item-price">${(itemPrice * item.qty).toLocaleString()} ${currentCurrency === 'RUB' ? '₽' : '$'}</div>
                            <div class="cart-item-actions">
                                <button class="qty-btn" onclick="changeQty('${item.cartKey}', -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty('${item.cartKey}', 1)">+</button>
                                <button class="remove-item" onclick="removeFromCart('${item.cartKey}')">Удалить</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const finalSum = Math.round(totalSum * discountMultiplier);
            cartTotalPrice.textContent = `${finalSum.toLocaleString()} ${currentCurrency === 'RUB' ? '₽' : '$'}`;
        }

        function changeQty(cartKey, delta) {
            const item = cart.find(i => i.cartKey === cartKey);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.cartKey !== cartKey);
                }
            }
            updateCartBadge();
            renderCart();
        }

        function removeFromCart(cartKey) {
            cart = cart.filter(i => i.cartKey !== cartKey);
            updateCartBadge();
            renderCart();
        }

        // Промокод
        applyPromoBtn.addEventListener('click', () => {
            if (promoInput.value.trim().toUpperCase() === 'AVANTI20') {
                discountMultiplier = 0.8;
                showToast(i18n[currentLang].promo_success);
                renderCart();
            } else {
                showToast(i18n[currentLang].promo_error);
            }
        });

        // Избранное
        function toggleWishlist(id) {
            if (wishlist.includes(id)) {
                wishlist = wishlist.filter(i => i !== id);
            } else {
                wishlist.push(id);
            }
            wishlistCount.textContent = wishlist.length;
            renderProducts();
            renderWishlist();
        }

        function renderWishlist() {
            if (wishlist.length === 0) {
                wishlistItemsContainer.innerHTML = `<div class="empty-cart">${i18n[currentLang].wishlist_empty}</div>`;
                return;
            }

            const wishItems = products.filter(p => wishlist.includes(p.id));
            wishlistItemsContainer.innerHTML = wishItems.map(item => {
                const price = currentCurrency === 'RUB' ? `${item.priceRUB} ₽` : `$${item.priceUSD}`;
                return `
                    <div class="cart-item">
                        <img src="${item.image}" alt="">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.title[currentLang]}</div>
                            <div class="cart-item-price">${price}</div>
                            <button class="btn-primary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; margin-top: 0.3rem;" onclick="addToCartDirect(${item.id}); toggleWishlist(${item.id});">${i18n[currentLang].to_cart}</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Выдвижные панели управления
        cartToggleBtn.addEventListener('click', () => {
            drawerOverlay.classList.add('open');
            cartDrawer.classList.add('open');
        });

        wishlistToggleBtn.addEventListener('click', () => {
            drawerOverlay.classList.add('open');
            wishlistDrawer.classList.add('open');
        });

        closeCart.addEventListener('click', closeDrawers);
        closeWishlist.addEventListener('click', closeDrawers);
        drawerOverlay.addEventListener('click', closeDrawers);

        function closeDrawers() {
            drawerOverlay.classList.remove('open');
            cartDrawer.classList.remove('open');
            wishlistDrawer.classList.remove('open');
        }

        checkoutBtn.addEventListener('click', () => {
            alert(i18n[currentLang].order_success);
            cart = [];
            discountMultiplier = 1;
            updateCartBadge();
            renderCart();
            closeDrawers();
        });

        function showToast(text) {
            toastNotification.textContent = text;
            toastNotification.classList.add('show');
            setTimeout(() => {
                toastNotification.classList.remove('show');
            }, 2500);
        }

        searchInput.addEventListener('input', renderProducts);
        sortSelect.addEventListener('change', renderProducts);
        document.querySelectorAll('input[name="category"], input[name="size"]').forEach(input => {
            input.addEventListener('change', renderProducts);
        });

        renderProducts();
    </script>
</body>
</html>
